server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*" # Allow the SvelteKit frontend to connect
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: registration-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
            
        - id: academic-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/academic/**
            
        - id: notification-service
          uri: ws://localhost:8083
          predicates:
            - Path=/ws/notifications/**

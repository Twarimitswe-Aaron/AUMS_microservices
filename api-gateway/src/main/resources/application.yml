server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173" # Specific to the SvelteKit frontend
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: registration-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
            
        - id: academic-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/academic/**
            
        - id: notification-service-ws
          uri: ws://localhost:8083
          predicates:
            - Path=/ws/notifications/**

        - id: notification-service-http
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/notifications/**

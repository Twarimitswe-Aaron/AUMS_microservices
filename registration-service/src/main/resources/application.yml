server:
  port: 8081

spring:
  application:
    name: registration-service

  datasource:
    url: jdbc:postgresql://localhost:5432/registration_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # As requested: Hibernate will only validate the schema, Flyway will create it.
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    producer:
      bootstrap-servers: localhost:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

jwt:
  # Random 256-bit secret key (Base64 encoded) for development:
  secret: Y2FjNjc3MjU1Yjk1NDU0MmZhMTFiZDRmOGY3NGI1YzdiMDU4YTNlOGIyYzBiYTNkYTMxMDcyYmEyZTMyZDRhZA==
  expiration: 86400000 # 1 Day in milliseconds


services:
  # -----------------------------------------
  # PostgreSQL (Database)
  # -----------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: sump-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sump_admin
      POSTGRES_PASSWORD: sump_password
      POSTGRES_DB: sump_admin
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    networks:
      - sump-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sump_admin"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -----------------------------------------
  # Redis (Caching + Token Blacklist)
  # -----------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sump-redis
    ports:
      - "6379:6379"
    networks:
      - sump-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -----------------------------------------
  # Zookeeper (Required for Kafka)
  # -----------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: sump-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - sump-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------
  # Kafka (Event Bus)
  # -----------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: sump-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - sump-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # -----------------------------------------
  # Registration Service (Port 8081)
  # -----------------------------------------
  registration-service:
    build:
      context: ../registration-service
      dockerfile: Dockerfile
    container_name: sump-registration
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/registration_db
      SPRING_DATASOURCE_USERNAME: sump_admin
      SPRING_DATASOURCE_PASSWORD: sump_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - sump-network
    restart: unless-stopped

  # -----------------------------------------
  # Academic Service (Port 8082)
  # -----------------------------------------
  academic-service:
    build:
      context: ../academic-service
      dockerfile: Dockerfile
    container_name: sump-academic
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/academic_db
      SPRING_DATASOURCE_USERNAME: sump_admin
      SPRING_DATASOURCE_PASSWORD: sump_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - sump-network
    restart: unless-stopped

  # -----------------------------------------
  # Notification Service (Port 8083)
  # -----------------------------------------
  notification-service:
    build:
      context: ../notification-service
      dockerfile: Dockerfile
    container_name: sump-notification
    ports:
      - "8083:8083"
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/notification_db
      SPRING_R2DBC_USERNAME: sump_admin
      SPRING_R2DBC_PASSWORD: sump_password
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: sump_admin
      SPRING_DATASOURCE_PASSWORD: sump_password
      SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - sump-network
    restart: unless-stopped

  # -----------------------------------------
  # API Gateway (Port 8080)
  # -----------------------------------------
  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    container_name: sump-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://registration-service:8081
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: http://academic-service:8082
      SPRING_CLOUD_GATEWAY_ROUTES_2_URI: ws://notification-service:8083
      SPRING_CLOUD_GATEWAY_ROUTES_3_URI: http://notification-service:8083
    depends_on:
      - registration-service
      - academic-service
      - notification-service
    networks:
      - sump-network
    restart: unless-stopped

  # -----------------------------------------
  # Frontend (SvelteKit dev server — Port 5173)
  # -----------------------------------------
  frontend:
    image: node:20-alpine
    container_name: sump-frontend
    working_dir: /app
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install -g pnpm && pnpm install && pnpm dev --host 0.0.0.0"
    depends_on:
      - api-gateway
    networks:
      - sump-network
    restart: unless-stopped

networks:
  sump-network:
    driver: bridge

volumes:
  postgres-data:
